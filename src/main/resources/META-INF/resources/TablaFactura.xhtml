<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Cafetería Kaven - Gestión de Facturas</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/primeone-dark.css"/>
        <h:outputStylesheet name="styleweb.css"/>
    </h:head>
    <h:body>
        <div class="card">
            <h:form id="formulario-facturas">

                <p:growl id="mensaje_emergente" showDetails="true"/>

                <div class="card">
                    <p:menubar styleClass="cafeteria-header">
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-home"
                                    update=":formulario-facturas:tabla-facturas"
                                    actionListener="#{webTablaFacturasController.cargarDatos}"/>

                        <p:menuitem value="Nueva Factura" icon="pi pi-fw pi-plus"
                                    actionListener="#{webTablaFacturasController.agregarFactura}"
                                    update=":formulario-modal:ventana-factura"
                                    oncomplete="PF('ventanaModalFactura').show()"/>
                    </p:menubar>
                </div>

                <div class="card">
                    <p:dataTable value="#{webTablaFacturasController.facturas}" var="factura" id="tabla-facturas" widgetVar="tablaFacturas" styleClass="table-striped">
                        <!-- Encabezado -->
                        <f:facet name="header">
                            <div class="card-header">Facturas en Cafetería Kaven</div>
                        </f:facet>

                        <p:column headerText="ID">
                            <h:outputText value="#{factura.id}"/>
                        </p:column>
                        <p:column headerText="ID Estudiante">
                            <h:outputText value="#{factura.studentId}"/>
                        </p:column>
                        <p:column headerText="ID Pedido">
                            <h:outputText value="#{factura.ordersId}"/>
                        </p:column>
                        <p:column headerText="Total">
                            <h:outputText value="#{factura.total}"/>
                        </p:column>
                        <p:column headerText="Tipo de Pago">
                            <h:outputText value="#{factura.paymentType}"/>
                        </p:column>
                        <p:column headerText="Acciones">
                            <p:commandButton value="Editar" icon="pi pi-pencil" styleClass="button-primary"
                                             actionListener="#{webTablaFacturasController.prepararEdicion(factura)}"
                                             update=":formulario-modal:ventana-factura"/>
                            <p:commandButton value="Eliminar" icon="pi pi-trash" styleClass="button-danger"
                                             actionListener="#{webTablaFacturasController.eliminarFactura}"
                                             update=":formulario-facturas:tabla-facturas"/>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>

            <!-- Modal para agregar o editar factura -->
            <h:form id="formulario-modal">
                <p:dialog header="Detalle de la Factura" showEffect="fade"
                          modal="true" widgetVar="ventanaModalFactura" responsive="true">
                    <p:outputPanel id="ventana-factura" class="ui-fluid">
                        <div class="field">
                            <p:outputLabel for="studentId">ID Estudiante</p:outputLabel>
                            <p:inputText id="studentId" value="#{webTablaFacturasController.editStudentId}" required="true"/>
                        </div>
                        <div class="field">
                            <p:outputLabel for="orderId">ID Pedido</p:outputLabel>
                            <p:inputText id="orderId" value="#{webTablaFacturasController.editOrderId}" required="true"/>
                        </div>
                        <div class="field">
                            <p:outputLabel for="total">Total</p:outputLabel>
                            <p:inputText id="total" value="#{webTablaFacturasController.editTotal}" required="true"/>
                        </div>
                        <div class="field">
                            <p:outputLabel for="paymentType">Tipo de Pago</p:outputLabel>
                            <p:selectOneMenu id="paymentType" value="#{webTablaFacturasController.editPaymentType}" required="true">
                                <f:selectItem itemLabel="Efectivo" itemValue="EFECTIVO"/>
                                <f:selectItem itemLabel="Tarjeta de Crédito" itemValue="TARJETA_CREDITO"/>
                                <f:selectItem itemLabel="Transferencia Bancaria" itemValue="TRANSFERENCIA"/>
                                <f:selectItem itemLabel="Pago Móvil" itemValue="PAGO_MOVIL"/>
                            </p:selectOneMenu>
                        </div>
                    </p:outputPanel>
                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check" styleClass="button-primary"
                                         actionListener="#{webTablaFacturasController.guardarFactura}"
                                         update=":formulario-facturas:tabla-facturas"/>
                        <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="button-primary"
                                         onclick="PF('ventanaModalFactura').hide()" type="button"/>
                    </f:facet>
                </p:dialog>
            </h:form>

        </div>
    </h:body>
</h:html>
